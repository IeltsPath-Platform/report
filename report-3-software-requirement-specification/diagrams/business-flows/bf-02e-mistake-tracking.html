 x="33" y="536" width="250" height="48" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="565" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Open the review</text><rect x="305" y="622" width="290" height="76" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="450" y="646" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Choose first a set that tests</text><text x="450" y="665" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">the learner&#x27;s weakest</text><text x="450" y="684" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">mistake</text><rect x="33" y="724" width="250" height="62" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="750.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Do the review</text><text x="158" y="769.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">(BF-02d)</text><circle cx="158" cy="840" r="13" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><circle cx="158" cy="840" r="7" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/></svg></div></body></html>
