<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BF-02f Prerequisite check</title><style>body{margin:0;background:#ffffff}.wrap{overflow-x:auto}svg{min-width:858px;display:block}</style></head><body><div class="wrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858 848" width="858" height="848" role="img" aria-labelledby="bf-02f-prerequisite-check-title bf-02f-prerequisite-check-desc" font-family="Segoe UI, Arial, sans-serif"><title id="bf-02f-prerequisite-check-title">BF-02f Prerequisite check</title><desc id="bf-02f-prerequisite-check-desc">How the system walks back through earlier knowledge to find the gap behind a weak point.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f4e79"/></marker></defs><rect width="858" height="848" fill="#ffffff"/><rect x="8" y="8" width="300" height="832" fill="none" stroke="#9ca3af" stroke-width="1.2"/><rect x="8" y="8" width="300" height="44" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/><text x="158.0" y="37" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Learner</text><rect x="308" y="8" width="542" height="832" fill="none" stroke="#9ca3af" stroke-width="1.2"/><rect x="308" y="8" width="542" height="44" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/><text x="579.0" y="37" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">IELTSPath</text><polyline points="158,83 158,126" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="283,150 310,150" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="450,181 450,213" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="550,255 707,255" fill="none" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#arrow)"/><text x="574.0" y="245" w</text><rect x="310" y="119" width="280" height="62" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="450" y="145.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Look for the earlier knowledge</text><text x="450" y="164.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">this point builds on</text><polygon points="450,213 550,255 450,297 350,255" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="250.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Is there</text><text x="450" y="269.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">any?</text><circle cx="720" cy="255" r="13" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><circle cx="720" cy="255" r="7" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/><rect x="315" y="334" width="270" height="62" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="450" y="360.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Give a short check</text><text x="450" y="379.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">on each of them</text><rect x="33" y="334" width="250" height="62" rx="10" fill="#dbeafe" stroke="#3b6ea8" stroke-width="1.6"/><text x="158" y="360.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Answer the checks; may</text><text x="158" y="379.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">stop after one answer</text><polygon points="450,429 568,475 450,521 332,475" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="470.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Failed, with levels</text><text x="450" y="489.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">and checks left?</text><rect x="620" y="444" width="200" height="62" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="720" y="470.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Check what the failed</text><text x="720" y="489.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">point builds on</text><polygon points="450,548 555,590 450,632 345,590" fill="#fef3c7" stroke="#8a6100" stroke-width="1.6"/><text x="450" y="585.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Did any check</text><text x="450" y="604.5" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">fail?</text><rect x="605" y="552" width="230" height="76" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="720" y="576" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">The point under review</text><text x="720" y="595" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">is the gap: continue</text><text x="720" y="614" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">its review</text><rect x="305" y="667" width="290" height="76" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="450" y="691" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Require a review of each</text><text x="450" y="710" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">deepest failed point; the</text><text x="450" y="729" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">first review waits for them</text><circle cx="450" cy="805" r="13" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><circle cx="450" cy="805" r="7" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/></svg></div></body></html>
